[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pubmedqa-rag-project"
version = "0.1.0"
description = "PubMedQA corpus preparation and retrieval experiments"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "pandas",
    "sentence-transformers",
    "tqdm",
]

[project.optional-dependencies]
llm = [
    "openai",
    "python-dotenv",
]
notebook = [
    "jupyter",
    "matplotlib",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*", "scripts*"]
